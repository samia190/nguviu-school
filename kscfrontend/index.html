    <!-- Font optimization - use system fonts for fast rendering -->
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                     Roboto, "Helvetica Neue", Arial, sans-serif;
      }
    </style>

    
    <!-- Critical CSS inlined for faster first paint -->
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { 
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      #root { min-height: 100vh; }
      
      /* Initial Loader Styles - matches Loader component */
      .app-loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgb(31, 2, 248);
        z-index: 9999;
      }
      
      .initial-loader {
        position: relative;
        width: 140px;
        height: 140px;
      }
      
      .initial-loader-ring {
        position: absolute;
        inset: 0;
        border: 4px solid ( rgb(9, 63, 227),rgb(154, 8, 244),rgb(3, 250, 3),rgb(254, 254, 9));
        border-top-color: #dde805;
        border-radius: 50%;
        animation: spin 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
      }
      
      .initial-loader-logo {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 70%;
        height: 70%;
        object-fit: contain;
        border-radius: 50%;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Optimized Loading state matching Loader component -->
      <div class="app-loading">
        <div class="initial-loader">
          <div class="initial-loader-ring"></div>
          <img src="/header/logo.PNG" alt="kangaru girls logo" class="initial-loader-logo" />
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
