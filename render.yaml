# Render Blueprint — Infrastructure as Code
# Deploy both backend (web service) + frontend (static site)
# Docs: https://docs.render.com/blueprint-spec
#
# To deploy: Connect this repo on Render and it auto-detects this file.
# Or go to https://dashboard.render.com/blueprints and click "New Blueprint Instance"

services:
  # ── Backend API (Web Service) ──────────────────────────────
  - type: web
    name: kangarugirlsschool
    runtime: node
    region: oregon
    plan: free
    rootDir: kscbackend
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false  # Set manually in Render dashboard (secret)
      - key: JWT_SECRET
        generateValue: true  # Render generates a random 64-char value
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: ID_CARD_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://kangarugirlsschool-sc-ke.onrender.com
      - key: CORS_ORIGINS
        value: https://kangarugirlsschool-sc-ke.onrender.com,https://kangarugirlsschool.onrender.com
      - key: PUBLIC_ORIGIN
        value: https://kangarugirlsschool.onrender.com
      - key: CLOUDINARY_CLOUD_NAME
        sync: false  # Set manually
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: kangaru
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false

  # ── Frontend (Static Site) ─────────────────────────────────
  - type: web
    name: kangarugirlsschool-sc-ke
    env: static
    region: oregon
    plan: free
    rootDir: kscfrontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Frame-Options
        value: DENY
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://kangarugirlsschool.onrender.com
      - key: VITE_BACKEND_URL
        value: https://kangarugirlsschool.onrender.com
      - key: NODE_VERSION
        value: "18"
